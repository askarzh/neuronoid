[project]
name = "neuronoid"
version = "0.1.0"
description = "Агент, который сам учится играть в DOS-Arkanoid по пикселям экрана"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "libretro.py",
    "numpy",
    "pillow",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
